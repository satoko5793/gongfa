<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>25000 繁星功法商城 - 赛季荣誉榜 Demo</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20260410-fix1" />
    <link rel="stylesheet" href="styles.css?v=release-20260611-151806" />
    <link rel="stylesheet" href="styles/base.css?v=release-20260611-151806" />
    <style>
      body.honor-demo-page {
        --honor-ink: #17120f;
        --honor-gold: #f3c66a;
        --honor-red: #b94432;
        --honor-jade: #376b61;
        background: #17120f;
        color: #fff8e9;
      }

      .honor-demo-page .bg-gradient {
        background:
          linear-gradient(120deg, rgba(185, 68, 50, 0.35), transparent 34%),
          linear-gradient(245deg, rgba(55, 107, 97, 0.34), transparent 38%),
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 9px),
          linear-gradient(180deg, #211711 0%, #100d0b 58%, #070606 100%);
      }

      .honor-demo-page .app-header {
        color: #fff8e9;
      }

      .honor-demo-page .brand-title,
      .honor-demo-page .nav a {
        color: #fff8e9;
      }

      .honor-demo-page .nav a {
        border-color: rgba(255, 248, 233, 0.18);
        background: rgba(23, 18, 15, 0.2);
      }

      .honor-demo-page .brand-sub,
      .honor-demo-page .nav a:not(.active) {
        color: rgba(255, 248, 233, 0.72);
      }

      .honor-shell {
        max-width: 1240px;
        padding-bottom: 96px;
      }

      .honor-hero {
        min-height: calc(100vh - 112px);
        display: grid;
        grid-template-columns: minmax(0, 0.9fr) minmax(320px, 1.25fr);
        gap: clamp(24px, 5vw, 64px);
        align-items: center;
        padding: clamp(18px, 4vw, 44px) 0;
      }

      .honor-kicker {
        display: inline-flex;
        width: fit-content;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border: 1px solid rgba(243, 198, 106, 0.34);
        color: #ffe6a6;
        background: rgba(243, 198, 106, 0.09);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .honor-title {
        margin: 20px 0 0;
        font-family: var(--font-display);
        font-size: clamp(54px, 9vw, 116px);
        line-height: 0.86;
        letter-spacing: 0;
        color: #fff7e5;
        text-shadow: 0 12px 34px rgba(0, 0, 0, 0.5);
        animation: honorTextRise 780ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      .honor-title span {
        display: block;
        color: var(--honor-gold);
      }

      .honor-season-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 28px;
      }

      .honor-pill {
        display: inline-flex;
        align-items: center;
        min-height: 38px;
        padding: 8px 13px;
        border: 1px solid rgba(255, 248, 233, 0.16);
        background: rgba(255, 248, 233, 0.08);
        color: rgba(255, 248, 233, 0.88);
        font-size: 13px;
        font-weight: 700;
      }

      .honor-stage {
        position: relative;
        min-height: 560px;
        perspective: 1200px;
        transform-style: preserve-3d;
        animation: honorStageBreathe 7s ease-in-out infinite;
      }

      .honor-stage::before,
      .honor-stage::after {
        content: "";
        position: absolute;
        inset: 14% 8% auto;
        height: 34%;
        background:
          linear-gradient(90deg, transparent, rgba(243, 198, 106, 0.18), transparent),
          linear-gradient(180deg, rgba(255, 248, 233, 0.1), transparent);
        clip-path: polygon(18% 0, 82% 0, 100% 100%, 0 100%);
        opacity: 0.62;
        transform: rotateX(62deg);
        transform-origin: center top;
        pointer-events: none;
      }

      .honor-stage::before {
        display: none;
      }

      .honor-stage::after {
        inset: auto 11% 7%;
        height: 116px;
        background: linear-gradient(90deg, transparent, rgba(243, 198, 106, 0.24), transparent);
        clip-path: ellipse(42% 26% at 50% 50%);
        transform: none;
      }

      .honor-spotlight {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 50% 31%, rgba(243, 198, 106, 0.18), transparent 19%),
          conic-gradient(from 180deg at 50% 44%, transparent, rgba(255, 248, 233, 0.065), transparent 26%);
        filter: blur(0.2px);
        opacity: 0.9;
        mix-blend-mode: screen;
        animation: honorSpotSweep 5.6s ease-in-out infinite;
      }

      .honor-rail {
        position: absolute;
        left: 18%;
        right: 18%;
        top: 50%;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(243, 198, 106, 0.7), transparent);
        opacity: 0.5;
        transform: translateZ(-120px) rotateX(62deg);
      }

      .honor-rail::before,
      .honor-rail::after {
        content: "";
        position: absolute;
        top: -6px;
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: var(--honor-gold);
        box-shadow: 0 0 22px rgba(243, 198, 106, 0.8);
        animation: honorRailPulse 2.2s ease-in-out infinite;
      }

      .honor-rail::before {
        left: 16%;
      }

      .honor-rail::after {
        right: 16%;
        animation-delay: 0.6s;
      }

      .honor-card {
        position: absolute;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        overflow: hidden;
        border: 1px solid rgba(243, 198, 106, 0.28);
        background:
          linear-gradient(145deg, rgba(255, 248, 233, 0.16), rgba(255, 248, 233, 0.04)),
          rgba(19, 14, 11, 0.86);
        box-shadow: 0 32px 74px rgba(0, 0, 0, 0.48);
        transform-style: preserve-3d;
        isolation: isolate;
        transition:
          transform 720ms cubic-bezier(0.2, 0.8, 0.2, 1),
          opacity 520ms ease,
          filter 520ms ease,
          border-color 520ms ease;
        animation: honorCardEnter 900ms cubic-bezier(0.18, 0.9, 0.18, 1) both;
        animation-delay: var(--enter-delay, 0ms);
      }

      .honor-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(110deg, transparent 0 38%, rgba(255, 255, 255, 0.2) 46%, transparent 54% 100%),
          linear-gradient(180deg, rgba(243, 198, 106, 0.2), transparent 42%);
        mix-blend-mode: screen;
        opacity: 0.7;
        pointer-events: none;
        z-index: 2;
        transform: translateX(-34%);
        animation: honorCardSheen 4.8s ease-in-out infinite;
        animation-delay: var(--sheen-delay, 0ms);
      }

      .honor-card::after {
        content: "";
        position: absolute;
        inset: 10px;
        border: 1px solid rgba(243, 198, 106, 0.2);
        pointer-events: none;
        z-index: 3;
      }

      .honor-card.is-dim {
        opacity: 0.48;
        filter: saturate(0.76) brightness(0.78);
      }

      .honor-card.is-active {
        opacity: 1;
        filter: saturate(1.08) brightness(1.06);
        border-color: rgba(243, 198, 106, 0.62);
        box-shadow:
          0 36px 82px rgba(0, 0, 0, 0.56),
          0 0 44px rgba(243, 198, 106, 0.18);
      }

      .honor-card-rank {
        position: relative;
        z-index: 3;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 18px 0;
        color: #ffe6a6;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0.18em;
      }

      .honor-card-rank b {
        font-family: var(--font-display);
        font-size: 34px;
        line-height: 1;
        letter-spacing: 0;
      }

      .honor-card-art {
        position: relative;
        z-index: 1;
        display: grid;
        place-items: center;
        min-height: 0;
        padding: 10px 18px;
      }

      .honor-card-art img {
        width: min(78%, 250px);
        aspect-ratio: 2 / 3;
        object-fit: cover;
        border: 1px solid rgba(255, 248, 233, 0.28);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
      }

      .honor-card-art .honor-name-only {
        width: min(78%, 250px);
        aspect-ratio: 2 / 3;
        display: grid;
        place-items: center;
        border: 1px solid rgba(243, 198, 106, 0.38);
        background:
          linear-gradient(135deg, rgba(185, 68, 50, 0.46), rgba(243, 198, 106, 0.1)),
          repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0 1px, transparent 1px 10px);
        color: #fff6de;
        font-family: var(--font-display);
        font-size: clamp(42px, 6vw, 72px);
        font-weight: 800;
      }

      .honor-card-info {
        position: relative;
        z-index: 3;
        padding: 0 18px 20px;
      }

      .honor-card-name {
        font-family: var(--font-display);
        font-size: clamp(34px, 5vw, 58px);
        line-height: 0.95;
        color: #fff7e5;
      }

      .honor-card-name span {
        display: inline-block;
        transform: translateY(24px);
        opacity: 0;
        animation: honorWordPop 620ms cubic-bezier(0.18, 0.9, 0.18, 1) both;
        animation-delay: calc(var(--enter-delay, 0ms) + 260ms);
      }

      .honor-card-owner {
        margin-top: 10px;
        color: rgba(255, 248, 233, 0.78);
        font-size: 15px;
        font-weight: 700;
      }

      .honor-card-owner strong {
        color: var(--honor-gold);
        font-size: 18px;
      }

      .honor-card.primary {
        inset: 4% 16% auto;
        height: 74%;
        z-index: 5;
        border-color: rgba(243, 198, 106, 0.46);
        transform: translateZ(70px);
        --enter-delay: 80ms;
        --sheen-delay: 300ms;
      }

      .honor-card.secondary {
        left: 0;
        top: 19%;
        width: 34%;
        height: 47%;
        z-index: 4;
        transform: rotateY(18deg) rotateZ(-4deg) translateZ(16px);
        --enter-delay: 250ms;
        --sheen-delay: 900ms;
      }

      .honor-card.tertiary {
        right: 2%;
        top: 28%;
        width: 31%;
        height: 42%;
        z-index: 3;
        transform: rotateY(-16deg) rotateZ(5deg) translateZ(10px);
        --enter-delay: 410ms;
        --sheen-delay: 1400ms;
      }

      .honor-card.quaternary {
        right: 16%;
        bottom: 0;
        width: 36%;
        height: 36%;
        z-index: 6;
        transform: rotateZ(2deg) translateZ(40px);
        --enter-delay: 560ms;
        --sheen-delay: 1900ms;
      }

      .honor-card.primary.is-active {
        transform:
          rotateX(calc(var(--tilt-y, 0) * 1deg))
          rotateY(calc(var(--tilt-x, 0) * -1deg))
          translateZ(110px)
          scale(1.035);
      }

      .honor-card.secondary.is-active {
        transform:
          rotateY(9deg)
          rotateZ(-2deg)
          translateZ(92px)
          scale(1.08);
      }

      .honor-card.tertiary.is-active {
        transform:
          rotateY(-9deg)
          rotateZ(2deg)
          translateZ(88px)
          scale(1.08);
      }

      .honor-card.quaternary.is-active {
        transform: rotateZ(0deg) translateZ(108px) scale(1.08);
      }

      .honor-card.primary.is-dim {
        transform: translateZ(30px) scale(0.98);
      }

      .honor-card.secondary.is-dim {
        transform: rotateY(22deg) rotateZ(-5deg) translateZ(-10px) scale(0.95);
      }

      .honor-card.tertiary.is-dim {
        transform: rotateY(-20deg) rotateZ(6deg) translateZ(-14px) scale(0.95);
      }

      .honor-card.quaternary.is-dim {
        transform: rotateZ(3deg) translateZ(0) scale(0.96);
      }

      .honor-controls {
        position: absolute;
        left: 50%;
        bottom: -22px;
        z-index: 12;
        display: flex;
        gap: 8px;
        transform: translateX(-50%);
        padding: 7px;
        border: 1px solid rgba(255, 248, 233, 0.15);
        background: rgba(9, 7, 6, 0.62);
        backdrop-filter: blur(12px);
      }

      .honor-control {
        width: 38px;
        height: 34px;
        border: 1px solid rgba(255, 248, 233, 0.16);
        background: rgba(255, 248, 233, 0.08);
        color: rgba(255, 248, 233, 0.76);
        font-weight: 900;
        cursor: pointer;
      }

      .honor-control.active {
        border-color: rgba(243, 198, 106, 0.62);
        background: rgba(243, 198, 106, 0.2);
        color: #ffe6a6;
      }

      .honor-card.quaternary .honor-card-art {
        display: none;
      }

      .honor-card.quaternary .honor-card-info {
        padding-top: 18px;
      }

      .honor-grid-stage {
        display: block;
        min-height: 650px;
        isolation: isolate;
      }

      .honor-grid-stage::before {
        inset: 10% 2% auto;
        height: 66%;
        clip-path: polygon(18% 0, 82% 0, 100% 100%, 0 100%);
        opacity: 0.58;
      }

      .honor-grid-stage::after {
        inset: auto 8% 3%;
        height: 138px;
        opacity: 0.72;
      }

      .honor-grid-stage .honor-card,
      .honor-grid-stage .honor-card.primary,
      .honor-grid-stage .honor-card.secondary,
      .honor-grid-stage .honor-card.tertiary,
      .honor-grid-stage .honor-card.quaternary {
        position: absolute;
        width: min(43%, 288px);
        height: auto;
        min-height: 0;
        aspect-ratio: 1 / 1;
      }

      .honor-grid-stage .honor-card.primary {
        left: 26%;
        top: 3%;
        z-index: 6;
        transform: rotateZ(-4deg) translateZ(36px);
        --enter-delay: 80ms;
      }

      .honor-grid-stage .honor-card.secondary {
        left: 5%;
        top: 31%;
        z-index: 4;
        transform: rotateY(18deg) rotateZ(5deg) translateZ(0);
        --enter-delay: 180ms;
      }

      .honor-grid-stage .honor-card.tertiary {
        right: 5%;
        top: 29%;
        z-index: 3;
        transform: rotateY(-18deg) rotateZ(-5deg) translateZ(-10px);
        --enter-delay: 280ms;
      }

      .honor-grid-stage .honor-card.quaternary {
        left: 29%;
        bottom: 1%;
        z-index: 5;
        transform: rotateZ(4deg) translateZ(22px);
        --enter-delay: 380ms;
      }

      .honor-grid-stage .honor-card.is-dim {
        opacity: 0.72;
        filter: saturate(0.9) brightness(0.88);
      }

      .honor-grid-stage .honor-card.is-active {
        transform:
          rotateX(calc(var(--tilt-y, 0) * 0.82deg))
          rotateY(calc(var(--tilt-x, 0) * -0.82deg))
          translateY(-16px)
          translateZ(120px)
          scale(1.18);
        z-index: 10;
      }

      .honor-grid-stage .honor-card.primary.is-dim {
        transform: rotateZ(-4deg) translateZ(24px) scale(0.98);
      }

      .honor-grid-stage .honor-card.secondary.is-dim {
        transform: rotateY(20deg) rotateZ(5deg) translateZ(-8px) scale(0.96);
      }

      .honor-grid-stage .honor-card.tertiary.is-dim {
        transform: rotateY(-20deg) rotateZ(-5deg) translateZ(-16px) scale(0.96);
      }

      .honor-grid-stage .honor-card.quaternary.is-dim {
        transform: rotateZ(4deg) translateZ(10px) scale(0.98);
      }

      .honor-grid-stage .honor-card.quaternary .honor-card-art {
        display: grid;
      }

      .honor-grid-stage .honor-card.quaternary .honor-card-info {
        padding-top: 0;
      }

      .honor-grid-stage .honor-card-art {
        padding: 4px 14px;
      }

      .honor-grid-stage .honor-card-art img,
      .honor-grid-stage .honor-card-art .honor-name-only {
        width: min(58%, 150px);
        aspect-ratio: 1 / 1;
      }

      .honor-grid-stage .honor-card-name {
        font-size: clamp(28px, 3.6vw, 44px);
      }

      .honor-grid-stage .honor-card-rank span {
        letter-spacing: 0.14em;
      }

      .honor-grid-stage .honor-card-rank b {
        font-size: 28px;
      }

      .honor-dynamic-stage {
        display: block;
        min-height: 570px;
        overflow: visible;
      }

      #honor-card-deck {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
      }

      .honor-dynamic-stage .honor-card {
        position: absolute;
        left: 50%;
        top: 48%;
        width: clamp(178px, 28vw, 286px);
        height: auto;
        min-height: 0;
        aspect-ratio: 1 / 1;
        transform:
          translate(-50%, -50%)
          translateX(var(--deck-x, 0px))
          translateY(var(--deck-y, 0px))
          rotateY(var(--deck-ry, 0deg))
          rotateZ(var(--deck-rz, 0deg))
          translateZ(var(--deck-z, 0px))
          scale(var(--deck-scale, 1));
        opacity: var(--deck-opacity, 1);
        filter: saturate(var(--deck-saturate, 1)) brightness(var(--deck-brightness, 1));
        z-index: var(--deck-layer, 1);
        pointer-events: var(--deck-pointer, auto);
        visibility: var(--deck-visibility, visible);
      }

      .honor-dynamic-stage .honor-card.is-active {
        transform:
          translate(-50%, -50%)
          translateX(var(--deck-x, 0px))
          translateY(var(--deck-y, 0px))
          rotateX(calc(var(--tilt-y, 0) * 0.82deg))
          rotateY(calc(var(--tilt-x, 0) * -0.82deg))
          rotateZ(var(--deck-rz, 0deg))
          translateZ(var(--deck-z, 0px))
          scale(var(--deck-scale, 1));
      }

      .honor-dynamic-stage .honor-card-art {
        padding: 4px 14px;
      }

      .honor-dynamic-stage .honor-card-art img,
      .honor-dynamic-stage .honor-card-art .honor-name-only {
        width: min(58%, 152px);
        aspect-ratio: 1 / 1;
      }

      .honor-dynamic-stage .honor-card-name {
        font-size: clamp(28px, 3.6vw, 44px);
      }

      .honor-record-strip {
        position: absolute;
        left: 50%;
        right: auto;
        bottom: -28px;
        z-index: 14;
        width: min(92%, 680px);
        display: flex;
        gap: 8px;
        overflow-x: auto;
        transform: translateX(-50%);
        padding: 8px;
        border: 1px solid rgba(255, 248, 233, 0.15);
        background: rgba(9, 7, 6, 0.68);
        backdrop-filter: blur(12px);
        scrollbar-width: none;
      }

      .honor-record-strip::-webkit-scrollbar {
        display: none;
      }

      .honor-record-button {
        flex: 0 0 auto;
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255, 248, 233, 0.16);
        background: rgba(255, 248, 233, 0.08);
        color: rgba(255, 248, 233, 0.72);
        font-weight: 900;
        cursor: pointer;
      }

      .honor-record-button.active {
        border-color: rgba(243, 198, 106, 0.62);
        background: rgba(243, 198, 106, 0.2);
        color: #ffe6a6;
      }

      .honor-record-button:hover,
      .honor-record-button:focus-visible {
        border-color: rgba(243, 198, 106, 0.5);
        color: #ffe6a6;
        outline: none;
        transform: translateY(-2px);
      }

      .honor-section {
        display: grid;
        gap: 18px;
        margin-top: 24px;
      }

      .honor-section-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 18px;
      }

      .honor-section-title {
        margin: 0;
        font-family: var(--font-display);
        font-size: clamp(34px, 5vw, 58px);
        line-height: 1;
      }

      .honor-section-sub {
        color: rgba(255, 248, 233, 0.68);
      }

      .honor-deals {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 280px));
        gap: 16px;
        align-items: stretch;
      }

      .honor-deals.single {
        grid-template-columns: minmax(260px, 360px);
      }

      .honor-deal-card {
        position: relative;
        aspect-ratio: 1 / 1;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        overflow: hidden;
        padding: 16px;
        border: 1px solid rgba(243, 198, 106, 0.34);
        background:
          linear-gradient(145deg, rgba(243, 198, 106, 0.17), rgba(185, 68, 50, 0.1)),
          radial-gradient(circle at 64% 28%, rgba(255, 248, 233, 0.12), transparent 30%),
          rgba(18, 14, 12, 0.88);
        box-shadow: 0 28px 58px rgba(0, 0, 0, 0.42);
        transform: translateY(18px);
        opacity: 0;
        isolation: isolate;
        animation: honorTextRise 680ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
        animation-delay: var(--deal-delay, 0ms);
      }

      .honor-deal-card::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 2;
        background:
          linear-gradient(110deg, transparent 0 38%, rgba(255, 255, 255, 0.18) 47%, transparent 56%),
          linear-gradient(180deg, rgba(243, 198, 106, 0.18), transparent 42%);
        mix-blend-mode: screen;
        opacity: 0.68;
        animation: honorCardSheen 5.2s ease-in-out infinite;
        animation-delay: var(--deal-sheen-delay, 0ms);
        pointer-events: none;
      }

      .honor-deal-card::after {
        content: "";
        position: absolute;
        inset: 10px;
        z-index: 3;
        border: 1px solid rgba(243, 198, 106, 0.2);
        pointer-events: none;
      }

      .honor-deal-card:nth-child(1) {
        --deal-delay: 120ms;
        --deal-sheen-delay: 400ms;
      }

      .honor-deal-card:nth-child(2) {
        --deal-delay: 240ms;
        --deal-sheen-delay: 900ms;
      }

      .honor-deal-card:nth-child(3) {
        --deal-delay: 360ms;
        --deal-sheen-delay: 1400ms;
      }

      .honor-deal-label {
        position: relative;
        z-index: 4;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #ffe6a6;
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .honor-deal-label b {
        font-family: var(--font-display);
        font-size: 28px;
        letter-spacing: 0;
      }

      .honor-deal-art {
        position: relative;
        z-index: 1;
        display: grid;
        place-items: center;
        min-height: 0;
      }

      .honor-deal-art img {
        width: min(58%, 150px);
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border: 1px solid rgba(255, 248, 233, 0.24);
        box-shadow: 0 18px 34px rgba(0, 0, 0, 0.36);
      }

      .honor-deal-info {
        position: relative;
        z-index: 4;
      }

      .honor-deal-name {
        font-family: var(--font-display);
        font-size: clamp(30px, 4.2vw, 44px);
        line-height: 1;
        color: #fff7e5;
      }

      .honor-deal-owner {
        margin-top: 8px;
        color: rgba(255, 248, 233, 0.74);
        font-size: 15px;
        font-weight: 700;
      }

      .honor-deal-owner strong {
        color: var(--honor-gold);
        font-size: 18px;
      }

      .honor-demo-page .footer {
        color: rgba(255, 248, 233, 0.58);
      }

      @keyframes honorTextRise {
        from {
          opacity: 0;
          transform: translateY(34px) scale(0.98);
          filter: blur(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0);
        }
      }

      @keyframes honorWordPop {
        from {
          opacity: 0;
          transform: translateY(24px) scale(0.92);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes honorCardEnter {
        from {
          opacity: 0;
          filter: blur(14px);
          clip-path: inset(48% 48% 48% 48%);
        }
        to {
          opacity: 1;
          filter: blur(0);
          clip-path: inset(0);
        }
      }

      @keyframes honorCardSheen {
        0%,
        42% {
          transform: translateX(-42%);
          opacity: 0;
        }
        55% {
          opacity: 0.72;
        }
        78%,
        100% {
          transform: translateX(42%);
          opacity: 0;
        }
      }

      @keyframes honorStageBreathe {
        0%,
        100% {
          transform: translateY(0) rotateX(0deg);
        }
        50% {
          transform: translateY(-10px) rotateX(1deg);
        }
      }

      @keyframes honorSpotSweep {
        0%,
        100% {
          opacity: 0.72;
          transform: translateX(-2%);
        }
        50% {
          opacity: 1;
          transform: translateX(2%);
        }
      }

      @keyframes honorRailPulse {
        0%,
        100% {
          transform: scale(0.8);
          opacity: 0.35;
        }
        50% {
          transform: scale(1.45);
          opacity: 0.9;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .honor-demo-page *,
        .honor-demo-page *::before,
        .honor-demo-page *::after {
          animation-duration: 1ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 1ms !important;
          scroll-behavior: auto !important;
        }
      }

      @media (max-width: 960px) {
        .honor-hero {
          grid-template-columns: 1fr;
          min-height: auto;
        }

        .honor-stage {
          min-height: 760px;
        }

        .honor-controls {
          bottom: -10px;
        }

        .honor-card.primary {
          inset: 0 6% auto;
          height: 47%;
        }

        .honor-card.secondary,
        .honor-card.tertiary,
        .honor-card.quaternary {
          width: 44%;
          height: 31%;
          top: auto;
        }

        .honor-card.secondary {
          left: 3%;
          bottom: 16%;
        }

        .honor-card.tertiary {
          right: 3%;
          bottom: 13%;
        }

        .honor-card.quaternary {
          left: 28%;
          right: auto;
          bottom: 0;
        }

        .honor-grid-stage .honor-card,
        .honor-grid-stage .honor-card.primary,
        .honor-grid-stage .honor-card.secondary,
        .honor-grid-stage .honor-card.tertiary,
        .honor-grid-stage .honor-card.quaternary {
          width: min(44%, 300px);
          aspect-ratio: 1 / 1;
        }

        .honor-deals {
          grid-template-columns: repeat(auto-fit, minmax(210px, 280px));
        }
      }

      @media (max-width: 620px) {
        .honor-stage {
          display: grid;
          gap: 14px;
          min-height: 0;
          perspective: none;
        }

        .honor-stage::before,
        .honor-stage::after {
          display: none;
        }

        .honor-card,
        .honor-card.primary,
        .honor-card.secondary,
        .honor-card.tertiary,
        .honor-card.quaternary {
          position: relative;
          inset: auto;
          width: 100%;
          height: auto;
          min-height: 0;
          aspect-ratio: 1 / 1;
          transform: none;
        }

        .honor-grid-stage .honor-card,
        .honor-grid-stage .honor-card.primary,
        .honor-grid-stage .honor-card.secondary,
        .honor-grid-stage .honor-card.tertiary,
        .honor-grid-stage .honor-card.quaternary {
          position: relative;
          inset: auto;
          width: 100%;
          min-height: 0;
          aspect-ratio: 1 / 1;
          transform: none;
        }

        .honor-card.primary.is-active,
        .honor-card.secondary.is-active,
        .honor-card.tertiary.is-active,
        .honor-card.quaternary.is-active,
        .honor-card.primary.is-dim,
        .honor-card.secondary.is-dim,
        .honor-card.tertiary.is-dim,
        .honor-card.quaternary.is-dim {
          transform: none;
        }

        .honor-grid-stage .honor-card.is-active,
        .honor-grid-stage .honor-card.primary.is-dim,
        .honor-grid-stage .honor-card.secondary.is-dim,
        .honor-grid-stage .honor-card.tertiary.is-dim,
        .honor-grid-stage .honor-card.quaternary.is-dim {
          transform: none;
        }

        .honor-controls {
          position: sticky;
          bottom: 12px;
          margin: 0 auto;
          transform: none;
          width: fit-content;
        }

        .honor-card.quaternary .honor-card-art {
          display: grid;
        }

        .honor-section-head {
          display: grid;
        }

        .honor-stage.honor-dynamic-stage {
          display: block;
          min-height: 500px;
          perspective: 900px;
        }

        .honor-stage.honor-dynamic-stage::before,
        .honor-stage.honor-dynamic-stage::after {
          display: block;
        }

        .honor-dynamic-stage .honor-card {
          position: absolute;
          left: 50%;
          top: 40%;
          width: min(62vw, 230px);
          transform:
            translate(-50%, -50%)
            translateX(var(--deck-x, 0px))
            translateY(var(--deck-y, 0px))
            rotateY(var(--deck-ry, 0deg))
            rotateZ(var(--deck-rz, 0deg))
            translateZ(var(--deck-z, 0px))
            scale(var(--deck-scale, 1));
        }

        .honor-dynamic-stage .honor-card.is-active {
          transform:
            translate(-50%, -50%)
            translateX(var(--deck-x, 0px))
            translateY(var(--deck-y, 0px))
            rotateX(calc(var(--tilt-y, 0) * 0.45deg))
            rotateY(calc(var(--tilt-x, 0) * -0.45deg))
            rotateZ(var(--deck-rz, 0deg))
            translateZ(var(--deck-z, 0px))
            scale(var(--deck-scale, 1));
        }

        .honor-record-strip {
          bottom: 2px;
          width: 96%;
        }
      }
    </style>
  </head>
  <body class="honor-demo-page" data-page-entry="honor-demo">
    <div class="bg-gradient"></div>
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark">G</span>
        <div>
          <div class="brand-title">功法卡片商城</div>
          <div class="brand-sub">S5 朱明赛季</div>
        </div>
      </div>
      <nav class="nav">
        <a href="shop.html">商城</a>
        <a href="auction.html">拍卖代抽</a>
        <a class="active" href="honor-demo.html">荣誉榜</a>
        <a href="me.html">个人后台</a>
      </nav>
    </header>

    <main class="container honor-shell">
      <section class="honor-hero">
        <div>
          <div class="honor-kicker">Season Honor Board</div>
          <h1 class="honor-title">赛季<span>荣誉榜</span></h1>
          <div class="honor-season-row">
            <span class="honor-pill">S5 朱明赛季</span>
            <span class="honor-pill">代抽高光</span>
            <span class="honor-pill">珍卡成交</span>
          </div>
        </div>

        <div class="honor-stage honor-dynamic-stage" id="honor-stage" aria-label="本赛季珍卡归属">
          <div class="honor-spotlight" aria-hidden="true"></div>
          <div class="honor-rail" aria-hidden="true"></div>
          <div id="honor-card-deck"></div>
          <div class="honor-record-strip" id="honor-record-strip" aria-label="切换珍卡记录"></div>
        </div>
      </section>

      <section class="honor-section" id="honor-deals-section">
        <div class="honor-section-head">
          <div>
            <div class="honor-kicker">Treasure Deals</div>
            <h2 class="honor-section-title">本赛季珍卡成交</h2>
          </div>
        </div>
        <div class="honor-deals" id="honor-deal-board" aria-label="本赛季珍卡成交"></div>
      </section>
    </main>

    <footer class="footer">赛季荣誉榜 Demo，仅用于确认视觉方向。</footer>
    <script>
      (() => {
        const stage = document.getElementById("honor-stage");
        const deck = document.getElementById("honor-card-deck");
        const strip = document.getElementById("honor-record-strip");
        const dealBoard = document.getElementById("honor-deal-board");
        if (!stage || !deck || !strip || !dealBoard) return;

        const honorRecords = [
          {
            cardName: "因果律",
            owner: "Pluto",
            art: "legacy-assets-hd/珍 因果律.png",
            artAlt: "珍 因果律",
          },
          {
            cardName: "乾坤",
            owner: "王氏响声丸",
            art: "legacy-assets-hd/珍 乾坤一掷.png",
            artAlt: "珍 乾坤一掷",
          },
          {
            cardName: "马后炮",
            owner: "待补",
            art: "legacy-assets-hd/珍 连环马后炮.png",
            artAlt: "珍 连环马后炮",
          },
          {
            cardName: "乾坤",
            owner: "柒七、",
            art: "legacy-assets-hd/珍 乾坤一掷.png",
            artAlt: "珍 乾坤一掷",
          },
        ];

        if (new URLSearchParams(window.location.search).has("stress")) {
          honorRecords.push(
            { cardName: "运气决", owner: "扩展示例 A", art: "legacy-assets-hd/珍 运气决.png", artAlt: "珍 运气决" },
            { cardName: "花开富贵", owner: "扩展示例 B", art: "legacy-assets-hd/珍 花卡富贵掌.png", artAlt: "珍 花卡富贵掌" },
            { cardName: "因果律", owner: "扩展示例 C", art: "legacy-assets-hd/珍 因果律.png", artAlt: "珍 因果律" },
            { cardName: "马后炮", owner: "扩展示例 D", art: "legacy-assets-hd/珍 连环马后炮.png", artAlt: "珍 连环马后炮" },
            { cardName: "乾坤", owner: "扩展示例 E", art: "legacy-assets-hd/珍 乾坤一掷.png", artAlt: "珍 乾坤一掷" },
          );
        }

        const dealRecords = [
          {
            cardName: "连环马后炮",
            buyer: "北风",
            art: "legacy-assets-hd/珍 连环马后炮.png",
            artAlt: "珍 连环马后炮",
          },
        ];

        if (new URLSearchParams(window.location.search).has("stress")) {
          dealRecords.push({
            cardName: "连环马后炮",
            buyer: "方野",
            art: "legacy-assets-hd/珍 连环马后炮.png",
            artAlt: "珍 连环马后炮",
          });
        }

        function escapeHtml(value) {
          return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
        }

        function cardArtwork(record) {
          if (record.art) {
            return `<img src="${escapeHtml(record.art)}" alt="${escapeHtml(record.artAlt || record.cardName)}" />`;
          }
          return `<div class="honor-name-only">${escapeHtml(record.cardName)}</div>`;
        }

        function chineseCount(value) {
          const digits = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九"];
          if (value <= 10) return value === 10 ? "十" : digits[value];
          if (value < 20) return `十${digits[value - 10]}`;
          const ten = Math.floor(value / 10);
          const unit = value % 10;
          return `${digits[ten]}十${digits[unit]}`;
        }

        dealBoard.innerHTML = dealRecords
          .map((record, index) => {
            const sequence = String(index + 1).padStart(2, "0");
            return `
              <article class="honor-deal-card" aria-label="珍卡成交 ${escapeHtml(record.cardName)} ${escapeHtml(record.buyer)}">
                <div class="honor-deal-label"><span>Confirmed Deal</span><b>${sequence}</b></div>
                <div class="honor-deal-art"><img src="${escapeHtml(record.art)}" alt="${escapeHtml(record.artAlt || record.cardName)}" /></div>
                <div class="honor-deal-info">
                  <div class="honor-deal-name">${escapeHtml(record.cardName)}</div>
                  <div class="honor-deal-owner">老板 <strong>${escapeHtml(record.buyer)}</strong></div>
                </div>
              </article>
            `;
          })
          .join("");
        dealBoard.classList.toggle("single", dealRecords.length === 1);

        deck.innerHTML = honorRecords
          .map((record, index) => {
            const sequence = String(index + 1).padStart(2, "0");
            const recordLabel = `${chineseCount(index + 1)}珍`;
            return `
              <article class="honor-card is-dim" data-honor-card="${index}" aria-label="${escapeHtml(recordLabel)} ${escapeHtml(record.cardName)} ${escapeHtml(record.owner)}">
                <div class="honor-card-rank"><span>SEASON RECORD</span><b>${sequence}</b></div>
                <div class="honor-card-art">${cardArtwork(record)}</div>
                <div class="honor-card-info">
                  <div class="honor-card-name"><span>${escapeHtml(record.cardName)}</span></div>
                  <div class="honor-card-owner">${escapeHtml(recordLabel)}归属 <strong>${escapeHtml(record.owner)}</strong></div>
                </div>
              </article>
            `;
          })
          .join("");

        strip.innerHTML = honorRecords
          .map((_, index) => {
            const sequence = String(index + 1).padStart(2, "0");
            return `<button class="honor-record-button" type="button" data-honor-target="${index}" aria-label="查看第 ${index + 1} 条记录">${sequence}</button>`;
          })
          .join("");

        const cards = Array.from(deck.querySelectorAll("[data-honor-card]"));
        const controls = Array.from(strip.querySelectorAll("[data-honor-target]"));
        if (!cards.length) return;

        let activeIndex = 0;
        let timer = null;

        function signedOffset(index, active, total) {
          let diff = index - active;
          const half = total / 2;
          if (diff > half) diff -= total;
          if (diff < -half) diff += total;
          return diff;
        }

        function setDeckNumber(card, name, value, unit = "") {
          card.style.setProperty(name, `${value}${unit}`);
        }

        function setActive(index) {
          activeIndex = ((Number(index) || 0) + cards.length) % cards.length;
          cards.forEach((card, cardIndex) => {
            const active = cardIndex === activeIndex;
            const offset = signedOffset(cardIndex, activeIndex, cards.length);
            const abs = Math.abs(offset);
            const direction = offset === 0 ? 0 : Math.sign(offset);
            const visibleOffset = Math.max(-4, Math.min(4, offset));
            const isVisible = abs <= 4;
            const crossLift = abs % 2 === 0 ? -8 : 22;
            const x = offset === 0 ? 0 : visibleOffset * 94;
            const y = offset === 0 ? -20 : abs * 24 + crossLift;
            const z = offset === 0 ? 128 : Math.max(-120, 46 - abs * 30);
            const scale = offset === 0 ? 1.2 : Math.max(0.54, 0.9 - abs * 0.075);
            const rz = offset === 0 ? 0 : -direction * Math.min(22, 11 + abs * 2.4);
            const ry = offset === 0 ? 0 : direction * Math.min(20, 9 + abs * 3);
            const opacity = !isVisible ? 0 : offset === 0 ? 1 : Math.max(0.22, 0.78 - abs * 0.13);

            setDeckNumber(card, "--deck-x", x, "px");
            setDeckNumber(card, "--deck-y", y, "px");
            setDeckNumber(card, "--deck-z", z, "px");
            setDeckNumber(card, "--deck-scale", scale);
            setDeckNumber(card, "--deck-rz", rz, "deg");
            setDeckNumber(card, "--deck-ry", ry, "deg");
            setDeckNumber(card, "--deck-opacity", opacity);
            setDeckNumber(card, "--deck-saturate", active ? 1.08 : Math.max(0.72, 0.96 - abs * 0.06));
            setDeckNumber(card, "--deck-brightness", active ? 1.06 : Math.max(0.72, 0.92 - abs * 0.05));
            setDeckNumber(card, "--deck-layer", 100 - abs);
            card.style.setProperty("--deck-pointer", active ? "auto" : "none");
            card.style.setProperty("--deck-visibility", isVisible ? "visible" : "hidden");
            card.classList.toggle("is-active", active);
            card.classList.toggle("is-dim", !active);
          });
          controls.forEach((control, controlIndex) => {
            control.classList.toggle("active", controlIndex === activeIndex);
            control.setAttribute("aria-current", controlIndex === activeIndex ? "true" : "false");
          });
          const activeControl = controls[activeIndex];
          if (activeControl) {
            const centeredLeft = activeControl.offsetLeft - (strip.clientWidth - activeControl.clientWidth) / 2;
            strip.scrollTo({ left: Math.max(0, centeredLeft), behavior: "smooth" });
          }
        }

        function startCycle() {
          clearInterval(timer);
          timer = setInterval(() => setActive(activeIndex + 1), 3200);
        }

        controls.forEach((control) => {
          control.addEventListener("click", () => {
            setActive(control.getAttribute("data-honor-target"));
            startCycle();
          });
        });

        stage.addEventListener("mousemove", (event) => {
          const activeCard = cards[activeIndex];
          if (!activeCard) return;
          const rect = activeCard.getBoundingClientRect();
          const x = ((event.clientX - rect.left) / Math.max(rect.width, 1) - 0.5) * 8;
          const y = ((event.clientY - rect.top) / Math.max(rect.height, 1) - 0.5) * 8;
          activeCard.style.setProperty("--tilt-x", x.toFixed(2));
          activeCard.style.setProperty("--tilt-y", y.toFixed(2));
        });

        stage.addEventListener("mouseleave", () => {
          cards.forEach((card) => {
            card.style.setProperty("--tilt-x", "0");
            card.style.setProperty("--tilt-y", "0");
          });
        });

        setActive(0);
        startCycle();
      })();
    </script>
  </body>
